quality_controls:
  candidate_preflight: true
  unique_fact_key: sk_fato
  source_target_key_comparison:
  - order_id
  - item_seq
  null_revenue_tolerance: 0
  missing_keys_tolerance: 0
  extra_keys_tolerance: 0
  discount_allocation_tolerance: 0.01
  dimensional_resolution: MONITORED_NOT_BLOCKING
publication:
  automatic_financial_correction: false
  physical_gold_republication: NOT_AUTHORIZED
  human_approval_required_for_financial_changes: true
known_limitations:
- Campos financeiros atualmente FLOAT
- Reconciliacao entre valores do cabecalho e itens pendente
- Publicacao Gold por multiplos CREATE OR REPLACE nao atomica
- Schema fisico nao expressa obrigatoriedade logica das chaves
- Contrato ainda nao homologado
